name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  rust-quality:
    name: Rust — lint & fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/release-version.sh check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-quality
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Tier: offline (required) — unit + workspace tests; no live LLM/network secrets.
  # Mocked protocol MCP e2e (Axum loopback) runs inside the workspace suite.
  # Live provider smoke is headless-smoke.yml only and must never block merge.
  rust:
    name: Rust — tests (offline)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            workspace_test_cmd: cargo test --workspace --exclude edgecrab-lsp -- --test-threads=1
          - os: macos-14
            workspace_test_cmd: cargo test --workspace --exclude edgecrab-lsp --no-run
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/release-version.sh check
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-tests-${{ matrix.os }}
      - run: cargo test -p edgecrab-lsp --all-targets
      - run: ${{ matrix.workspace_test_cmd }}
      - name: Offline harness + MCP mock gates (027 Wave 0)
        if: matrix.os == 'ubuntu-latest'
        run: |
          bash scripts/check-no-flaky-heuristics.sh
          cargo test -p edgecrab-core --test harness_nonflaky_e2e
          cargo test -p edgecrab-cli --test mcp_agent_visibility_e2e
          cargo test -p edgecrab-cli --test mcp_oauth_discover_e2e
          cargo test -p edgecrab-cli --test mcp_register_e2e
      - if: matrix.os == 'macos-14'
        run: cargo test -p edgecrab-cli --test plugins_e2e
      - if: matrix.os == 'macos-14'
        run: cargo test -p edgecrab-gateway gateway_keeps_agent_history_isolated_per_chat_session
      - if: matrix.os == 'macos-14'
        run: cargo test -p edgecrab-gateway gateway_session_hooks_fire_across_chat_reset_and_shutdown

  python-sdk:
    name: Python SDK — build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-sdk
          workspaces: sdks/python -> target
      - run: |
          cd sdks/python
          python -m pip install --upgrade pip build twine maturin pytest pytest-asyncio
          python -m pip install -e .
          cargo check -p edgecrab-python
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -p pytest_asyncio.plugin tests/test_sdk_e2e.py -v
          python -m build --sdist --outdir dist/
          python -m twine check dist/*

  node-sdk:
    name: Node.js SDK — build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            sdks/node/package-lock.json
            sdks/nodejs-native/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: node-sdk
      - name: Verify public Node SDK package
        run: |
          cd sdks/node
          npm ci
          npm run build
          npm test
          npm pack --dry-run
      - name: Verify native Node bindings package
        run: |
          cd sdks/nodejs-native
          npm ci
          npm run build
          npm test

  docker-smoke:
    name: Docker — build smoke test
    # Full image build is expensive; run on main pushes and when Docker inputs change.
    if: >
      github.event_name == 'push' ||
      contains(toJSON(github.event.pull_request.labels.*.name), 'docker')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha,scope=ci-docker
          cache-to: type=gha,scope=ci-docker,mode=max

  wasm-sdk:
    name: WASM SDK — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-sdk
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: |
          cd sdks/wasm
          wasm-pack build --target web --dev

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  otel-collector:
    name: OTEL — collector e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: otel-collector
      - name: Start OTLP collector
        run: docker compose -f infra/otel/docker-compose.yaml up -d
      - name: Wait for collector
        run: |
          for _ in $(seq 1 30); do
            if nc -z localhost 4317; then
              exit 0
            fi
            sleep 1
          done
          echo "OTLP collector did not become ready on :4317"
          docker compose -f infra/otel/docker-compose.yaml logs
          exit 1
      - name: Collector integration smoke test
        run: cargo test -p edgecrab-core --test otel_collector_e2e -- --ignored
      - name: Offline OTEL unit tests
        run: cargo test -p edgecrab-core otel
      - name: Stop collector
        if: always()
        run: docker compose -f infra/otel/docker-compose.yaml down

  site:
    name: Site — build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - run: pnpm run build
        working-directory: site
