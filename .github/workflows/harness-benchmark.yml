name: Harness Benchmark

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  harness-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: harness_games003_replay
        run: cargo test -p edgecrab-core --test harness_games003_replay

      - name: local_harness_geometry_e2e
        run: cargo test -p edgecrab-core --test local_harness_geometry_e2e

      - name: context_cache_efficiency_e2e
        run: cargo test -p edgecrab-core --test context_cache_efficiency_e2e

      - name: threat_patterns unit tests
        run: cargo test -p edgecrab-security --lib threat_patterns

      - name: sota_harness_wave_e2e
        run: cargo test -p edgecrab-core --test sota_harness_wave_e2e

      - name: harness_failover_matrix
        run: cargo test -p edgecrab-core --test harness_failover_matrix

      # Wave 0 / 027: offline evidence-latch e2e (required; no network, no sleeps, no LLM)
      - name: harness_nonflaky_e2e
        run: cargo test -p edgecrab-core --test harness_nonflaky_e2e

      - name: dry-solid harness gates (018)
        run: |
          cargo test -p edgecrab-core --lib turn_dispatch_policy
          cargo test -p edgecrab-core --test dry_solid_harness_gates
          cargo test -p edgecrab-types --lib harness::tests
          cargo test -p edgecrab-tools --lib tool_input_examples

      - name: no flaky heuristics (018 F1–F4)
        run: bash scripts/check-no-flaky-heuristics.sh

      - name: local harness scorecard (018 July integrity)
        run: |
          set -euo pipefail
          passed=0
          failed=0
          run_one() {
            local label="$1"; shift
            if "$@"; then
              echo "PASS $label"
              passed=$((passed + 1))
            else
              echo "FAIL $label"
              failed=$((failed + 1))
            fi
          }
          run_one dry_solid cargo test -p edgecrab-core --test dry_solid_harness_gates -- --quiet
          run_one games003 cargo test -p edgecrab-core --test harness_games003_replay -- --quiet
          run_one visual_preview cargo test -p edgecrab-core --test visual_preview_lifecycle_e2e -- --quiet
          run_one ralph_contract cargo test -p edgecrab-core --test goals_ralph_loop contract_ -- --quiet
          run_one wave_ab cargo test -p edgecrab-core --lib wave_ -- --quiet
          run_one contract_verify cargo test -p edgecrab-core --lib contract_verify -- --quiet
          total=$((passed + failed))
          echo "LOCAL_HARNESS_SCORECARD passed=${passed} failed=${failed} total=${total}"
          if [ "$failed" -ne 0 ]; then exit 1; fi
